<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHC Pulse – Live Health Centre Control Room</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF4F1;--card:#fff;--ink:#10201A;--mute:#53675F;--g:#0F4C3A;--g2:#1E7A5C;--sun:#F2A007;--red:#C8372D;--amb:#D98A00;--ok:#1E7A5C;--line:#D3E0DA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1713;--card:#14241E;--ink:#E7F1EC;--mute:#9DB3A9;--g:#0A2E23;--g2:#3DB58A;--line:#244036;--red:#F0665B;--amb:#F2B13A;--ok:#3DB58A}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.nav{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;display:flex;gap:8px;align-items:center;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.nav b{margin-right:auto}.nav button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 14px}
.nav button.on{background:var(--sun);color:#10201A;border-color:var(--sun)}
main{max-width:1000px;margin:0 auto;padding:24px 16px 60px}
h2{font-size:clamp(1.8rem,5vw,2.8rem);margin:.2em 0;letter-spacing:-.02em;line-height:1.1}
.lead{color:var(--mute);max-width:60ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0}
.bar{display:grid;grid-template-columns:110px 1fr 48px;gap:8px;align-items:center;font-size:.85rem;margin:5px 0}
.bar i{display:block;height:14px;border-radius:7px;background:var(--g2)}
.bar .t{background:var(--line);border-radius:7px}
.note{font-size:.78rem;color:var(--mute)}
.alerts{display:grid;gap:8px}
.al{padding:10px 14px;border-radius:10px;border-left:6px solid;background:var(--card);font-weight:600}
.al.r{border-color:var(--red)}.al.a{border-color:var(--amb)}.al.o{border-color:var(--ok)}
.al small{display:block;font-weight:400;color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl{overflow-x:auto}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:800;color:#fff}
.pill.r{background:var(--red)}.pill.a{background:var(--amb)}.pill.o{background:var(--ok)}
.sm{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;min-width:34px;height:34px;font-weight:800}
.sm:hover{background:var(--sun);color:#10201A}
.num{font-size:3.2rem;font-weight:800;line-height:1}
.ts{font-size:.76rem;color:var(--mute)}
.face{font-size:1.6rem;background:transparent;border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.face:hover{background:var(--sun)}
.meter{height:18px;border-radius:9px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tk{background:var(--card);border:1px solid var(--line);border-left:6px solid;border-radius:10px;padding:12px 14px;margin:10px 0}.tk.r{border-left-color:var(--red)}.tk.a{border-left-color:var(--amb)}
.tk select,.tk textarea{font:inherit;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.tk textarea{min-height:56px;margin-top:8px}.tk .err{color:var(--red);font-weight:700;font-size:.85rem;margin-top:6px}
.pill.st{background:var(--mute)}.pill.ak{background:var(--g2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0}.stats div{border:1px solid var(--line);border-radius:10px;padding:8px 12px}.stats b{font-size:1.6rem;display:block;line-height:1.1}
.bt{border:0;border-radius:8px;padding:8px 14px;font-weight:800;background:var(--g2);color:#fff}.bt.y{background:var(--sun);color:#10201A}
.brief{border:2px solid var(--g2)}
.bigbt{background:var(--sun);color:#10201A;border:0;border-radius:999px;padding:12px 26px;font-weight:800;font-size:1.05rem}
.rk{border:1px solid var(--line);border-left:6px solid;border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--bg)}.rk.r{border-left-color:var(--red)}.rk.a{border-left-color:var(--amb)}
.rk h4{margin:0 0 4px}.rk ul{margin:4px 0 8px;padding-left:20px}.rk li{margin:2px 0}
.lbl{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-top:8px}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:10px 0}.qa div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}.qa b{display:block;font-size:1.05rem}.qa .q{font-size:.76rem;color:var(--mute);font-weight:600}
.stale{color:var(--red);font-weight:800}
details summary{cursor:pointer;font-weight:700;margin:8px 0}
details pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:.74rem;max-height:260px}
.tag{display:inline-block;font-size:.7rem;font-weight:800;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute);margin-left:6px}
</style></head><body>
<div id="app"></div>
<script>
function bars(d,u){var m=Math.max.apply(null,d.map(function(x){return x[1]}));return d.map(function(x){return '<div class="bar"><span>'+x[0]+'</span><span class="t"><i style="width:'+(x[1]/m*100)+'%"></i></span><b>'+x[1]+u+'</b></div>'}).join('')}

var KEY='phc-yashraj-v1';
function fresh(){var n=Date.now();return{stock:[{n:'Paracetamol 500mg',q:420,min:300,rate:60},{n:'ORS sachets',q:90,min:150,rate:25},{n:'Amoxicillin',q:260,min:200,rate:30},{n:'Iron-folic acid',q:700,min:400,rate:40},{n:'Anti-snake venom',q:3,min:5,rate:1}],foot:{c:128,limit:150},beds:{t:20,o:17},docs:[{n:'Dr. Sharma',r:'Medical Officer',p:1},{n:'Dr. Khan',r:'Medical Officer',p:0},{n:'Sister Meena',r:'Staff Nurse',p:1},{n:'Mr. Verma',r:'Lab Technician',p:0},{n:'Ms. Patel',r:'Pharmacist',p:1}],hap:[2,3,6,9,5],u:{s:n,f:n,b:n,d:n,h:n}}}
var S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.stock)S=fresh();
function save(k){S.u[k]=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}
function ago(t){var m=Math.round((Date.now()-t)/60000);return m<1?'just now':m<60?m+' min ago':new Date(t).toLocaleString()}

function stockAct(i,d){S.stock[i].q=Math.max(0,S.stock[i].q+d);save('s')}
function foot(d){S.foot.c=Math.max(0,S.foot.c+d);save('f')}
function bedAct(d){S.beds.o=Math.min(S.beds.t,Math.max(0,S.beds.o+d));save('b')}
function doc(i){S.docs[i].p=S.docs[i].p?0:1;save('d')}
function vote(i){S.hap[i]++;save('h')}
function reset(){S=fresh();save('s')}
function setFoot(){var v=parseInt(document.getElementById('fv').value,10);if(!isNaN(v)&&v>=0){S.foot.c=v;save('f')}}

function ensure(){if(!S.tasks){S.tasks=[];S.nid=1}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function tk(id){return S.tasks.filter(function(t){return t.id==id})[0]}
function tAck(id){var t=tk(id);t.st='ack';t.ack=Date.now();persist();render()}
function tSet(id,f,v){var t=tk(id);t[f]=v;t.err='';persist()}
function tDone(id){var t=tk(id);if(!t.role||!t.act.trim()){t.err='Assign a responsible role and record the action taken before resolving.';render();return}t.st='done';t.done=Date.now();t.err='';if(!t.ack)t.ack=t.done;persist();render()}
function dur(a,b){var m=Math.round((b-a)/60000);return m<1?'under 1 min':m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function actionCenter(al){ensure();var ch=0;
al.forEach(function(x){if(x[0]=='o')return;var live=S.tasks.filter(function(t){return t.title==x[1]&&t.st!='done'});if(!live.length){S.tasks.push({id:S.nid++,sev:x[0],title:x[1],detail:x[2],st:'open',role:'',act:'',cr:Date.now(),ack:0,done:0});ch=1}else{live[0].detail=x[2];live[0].sev=x[0]}});if(ch)persist();
var titles=al.map(function(x){return x[1]}),roles=['Medical Officer','Staff Nurse','Pharmacist','Lab Technician','ANM / ASHA supervisor','Block Medical Officer (BMO)'];
var op=S.tasks.filter(function(t){return t.st!='done'}).sort(function(a,b){return (a.sev=='r'?0:1)-(b.sev=='r'?0:1)||a.cr-b.cr}),dn=S.tasks.filter(function(t){return t.st=='done'}).sort(function(a,b){return b.done-a.done});
var crit=op.filter(function(t){return t.sev=='r'}).length,avg=dn.length?dur(0,dn.reduce(function(s,t){return s+(t.done-t.cr)},0)/dn.length):'none yet';
var h='<div class="card"><h3 style="margin-top:0">Action Center</h3><p class="lead" style="margin:0">Every alert becomes a task. Acknowledge it, assign a role, record what was done, then resolve it.</p><div class="stats"><div><b>'+op.length+'</b>Open tasks</div><div><b style="color:var(--red)">'+crit+'</b>Critical open</div><div><b>'+dn.length+'</b>Resolved</div><div><b style="font-size:1.1rem">'+avg+'</b>Avg time to resolve</div></div>';
if(!op.length)h+='<p class="al o">No open tasks. New alerts will appear here automatically.</p>';
op.forEach(function(t){h+='<div class="tk '+t.sev+'"><div class="row"><span class="pill '+t.sev+'">'+(t.sev=='r'?'CRITICAL':'WARNING')+'</span><b>'+esc(t.title)+'</b><span class="pill '+(t.st=='ack'?'ak':'st')+'">'+(t.st=='ack'?'Acknowledged':'New')+'</span></div><div class="ts">'+esc(t.detail)+'</div>';
if(titles.indexOf(t.title)<0)h+='<div class="ts" style="color:var(--ok);font-weight:700">The condition has cleared in the data. Record what fixed it and resolve.</div>';
h+='<div class="ts">Raised: '+ago(t.cr)+(t.ack?'. Acknowledged: '+ago(t.ack)+' (response in '+dur(t.cr,t.ack)+')':'')+'</div>';
h+='<div class="grid2" style="gap:8px;margin-top:8px"><div><label class="ts" for="r'+t.id+'">Responsible role</label><select id="r'+t.id+'" onchange="tSet('+t.id+',\'role\',this.value)"><option value="">Assign a role…</option>'+roles.map(function(r){return '<option'+(t.role==r?' selected':'')+'>'+r+'</option>'}).join('')+'</select></div><div><label class="ts" for="a'+t.id+'">Action taken</label><textarea id="a'+t.id+'" style="margin-top:0" placeholder="e.g. Requested 500 tablets from CHC store" onchange="tSet('+t.id+',\'act\',this.value)">'+esc(t.act)+'</textarea></div></div>';
if(t.err)h+='<div class="err">'+t.err+'</div>';
h+='<div class="row" style="margin-top:10px">'+(t.st=='open'?'<button class="bt y" onclick="tAck('+t.id+')">Acknowledge</button>':'')+'<button class="bt" onclick="tDone('+t.id+')">Mark resolved</button></div></div>'});
if(dn.length){h+='<h4 style="margin:18px 0 6px">Resolved history</h4><div class="tbl"><table><tr><th>Issue</th><th>Role</th><th>Action taken</th><th>Raised</th><th>Resolved</th><th>Time taken</th></tr>';dn.slice(0,8).forEach(function(t){h+='<tr><td>'+esc(t.title)+'</td><td>'+esc(t.role)+'</td><td>'+esc(t.act)+'</td><td>'+ago(t.cr)+'</td><td>'+ago(t.done)+'</td><td>'+dur(t.cr,t.done)+'</td></tr>'});h+='</table></div>'}
return h+'</div>'}
function alerts(){var a=[];
S.stock.forEach(function(m){var days=m.rate?m.q/m.rate:99;
if(m.q<=m.min)a.push(['r','Low stock: '+m.n,m.q+' left, minimum is '+m.min+(m.rate?'. Runs out in about '+days.toFixed(1)+' days.':'')]);
else if(days<7)a.push(['a','Stock-out soon: '+m.n,'About '+days.toFixed(1)+' days of stock left at current use.'])});
var fp=S.foot.c/S.foot.limit;
if(fp>=1)a.push(['r','High footfall','Today’s count '+S.foot.c+' is above the limit of '+S.foot.limit+'. Call extra staff.']);else if(fp>=.85)a.push(['a','Footfall near limit',S.foot.c+' of '+S.foot.limit+' patients today.']);
var fb=S.beds.t-S.beds.o;if(fb<=0)a.push(['r','No free beds','Divert new admissions to the nearest CHC.']);else if(fb<=2)a.push(['a','Only '+fb+' bed(s) free','Check before accepting referrals.']);
var pr=S.docs.filter(function(x){return x.p}).length,md=S.docs.filter(function(x){return x.r=='Medical Officer'&&x.p}).length;
if(md==0)a.push(['r','No doctor present','Staffing alert: no Medical Officer on duty.']);else if(md==1&&S.foot.c>100)a.push(['a','Staffing alert','Only 1 doctor for '+S.foot.c+' patients. Request a second doctor.']);
if(pr<S.docs.length/2)a.push(['a','Low staff attendance',pr+' of '+S.docs.length+' staff present.']);
if(!a.length)a.push(['o','All clear','No alerts. Stock, beds, footfall and staffing are within limits.']);
return a}
function happy(){var t=0,w=0;S.hap.forEach(function(v,i){t+=v;w+=v*(i)});return t?Math.round(w/(4*t)*100):0}

/* ---------- AI Facility Briefing ---------- */
var STALE={s:[24,'Medicine stock','Do a physical shelf count of the items flagged above.'],f:[4,'Footfall count','Confirm today\'s total against the OPD register.'],b:[6,'Bed occupancy','Walk the ward and confirm the occupied and free bed count.'],d:[8,'Staff attendance','Confirm attendance with the in-charge or the muster roll.']};
var BR=null;
function hrs(t,n){return (n-t)/3600000}
function fmtH(h){return h<1?Math.max(1,Math.round(h*60))+' min':h<48?Math.round(h)+' h':(h/24).toFixed(1)+' days'}
function liveFac(){var mo=S.docs.filter(function(x){return x.r=='Medical Officer'});return{id:'live',name:'Your PHC (live data)',kind:'PHC',stock:S.stock,foot:S.foot,beds:S.beds,staff:{total:S.docs.length,present:S.docs.filter(function(x){return x.p}).length,mo:mo.length,moP:mo.filter(function(x){return x.p}).length},u:{s:S.u.s,f:S.u.f,b:S.u.b,d:S.u.d}}}
function fleet(){var n=Date.now();function H(h){return n-h*3600000}
return[liveFac(),
{id:'dhamnod',name:'Dhamnod CHC',kind:'CHC (fictional)',stock:[{n:'Amoxicillin',q:40,min:200,rate:30},{n:'Anti-snake venom',q:0,min:5,rate:1},{n:'ORS sachets',q:120,min:150,rate:25},{n:'Paracetamol 500mg',q:380,min:300,rate:60}],foot:{c:150,limit:160},beds:{t:30,o:25},staff:{total:9,present:5,mo:3,moP:1},u:{s:H(52),f:H(1),b:H(30),d:H(3)}},
{id:'sanawad',name:'Sanawad PHC',kind:'PHC (fictional)',stock:[{n:'Paracetamol 500mg',q:520,min:300,rate:50},{n:'ORS sachets',q:140,min:150,rate:12},{n:'Iron-folic acid',q:900,min:400,rate:35}],foot:{c:95,limit:150},beds:{t:12,o:9},staff:{total:6,present:5,mo:1,moP:1},u:{s:H(5),f:H(2),b:H(3),d:H(20)}},
{id:'barwah',name:'Barwah PHC',kind:'PHC (fictional)',stock:[{n:'Paracetamol 500mg',q:80,min:300,rate:60},{n:'Insulin',q:14,min:10,rate:3},{n:'Amoxicillin',q:210,min:200,rate:20}],foot:{c:92,limit:100},beds:{t:10,o:10},staff:{total:5,present:2,mo:1,moP:0},u:{s:H(5),f:H(2),b:H(70),d:H(26)}}]}
function analyze(f,n){var R=[],G=[],crit=[],soon=[],zero=[];
f.stock.forEach(function(m){var d=m.rate?m.q/m.rate:99;if(m.q<=m.min){crit.push(m);if(m.q==0)zero.push(m)}else if(d<7)soon.push(m)});
function dl(m){return m.rate?'about '+(m.q/m.rate).toFixed(1)+' days left':'no usage rate set'}
function nm(a){return a.map(function(m){return m.n}).join(', ')}
var fp=f.foot.c/f.foot.limit,free=f.beds.t-f.beds.o,freePct=free/f.beds.t,head=Math.max(0,1-fp),stale=[];
['s','f','b','d'].forEach(function(k){var h=hrs(f.u[k],n);if(h>STALE[k][0])stale.push({k:k,label:STALE[k][1],h:h,lim:STALE[k][0],fix:STALE[k][2]})});
if(crit.length||soon.length){var ev=[],st=[];
crit.forEach(function(m){ev.push(m.n+': '+m.q+' on hand, minimum '+m.min+' ('+dl(m)+')')});
soon.forEach(function(m){ev.push(m.n+': '+m.q+' on hand, above minimum but only '+dl(m))});
if(crit.length)st.push('Raise an emergency indent for '+nm(crit)+' with the CHC store or district drug warehouse today.');
if(zero.length)st.push('For items at zero ('+nm(zero)+'), find the nearest facility holding stock and arrange a transfer, or tell OPD where to refer patients.');
if(crit.concat(soon).some(function(m){return /venom/i.test(m.n)}))st.push('Anti-snake venom is life-critical: confirm the nearest centre that holds it and brief the ambulance dispatcher.');
if(soon.length)st.push('Place a replenishment order for '+nm(soon)+' before they fall below minimum.');
R.push({sev:crit.length?'r':'a',w:crit.length*3+zero.length+soon.length,title:'Medicine stock-out risk',ev:ev,st:st})}
if(fp>=.85){var e2=[f.foot.c+' patients against a daily limit of '+f.foot.limit+' ('+Math.round(fp*100)+'% of capacity)'],s2=[];
e2.push('Medical officers present: '+f.staff.moP+' of '+f.staff.mo+(f.staff.moP?' (about '+Math.round(f.foot.c/f.staff.moP)+' patients per doctor)':''));
s2.push('Open a second registration and token queue and triage fever and emergency cases first.');
if(f.staff.moP<f.staff.mo)s2.push('Ask the BMO to send a visiting doctor or reassign a medical officer from a nearby facility.');
s2.push('Use nurses and ANMs for registration and vitals to speed up OPD.');
R.push({sev:fp>=1?'r':'a',w:fp>=1?3:1.5,title:fp>=1?'Footfall above daily limit':'Footfall near daily limit',ev:e2,st:s2})}
if(free<=2){var s3=['Review the ward for patients fit for discharge today to free beds.','Call the referral CHC to confirm a free bed before sending the next admission.'];
if(free<=0)s3.unshift('Pause new admissions and ask ambulance dispatch to route emergencies to the nearest CHC.');
R.push({sev:free<=0?'r':'a',w:free<=0?3:1.5,title:free<=0?'No free beds':'Bed capacity almost exhausted',ev:[f.beds.o+' of '+f.beds.t+' beds occupied, '+free+' free'],st:s3})}
if(f.staff.moP==0){R.push({sev:'r',w:5,title:'No medical officer on duty',ev:['0 of '+f.staff.mo+' medical officers marked present','Staff present overall: '+f.staff.present+' of '+f.staff.total],st:['Call the medical officer or BMO now to confirm whether this is leave, official duty or unplanned absence.','Arrange a stand-in doctor or a tele-consultation slot for today\'s OPD.','Record the absence in the attendance log so the district can see it.']})}
else if(f.staff.moP<f.staff.mo&&f.foot.c>100){R.push({sev:'a',w:1.5,title:'Doctor shortfall against footfall',ev:[f.staff.moP+' of '+f.staff.mo+' medical officers present for '+f.foot.c+' patients'],st:['Request a second doctor or rotate one in from a nearby facility.']})}
if(f.staff.present/f.staff.total<.5){R.push({sev:'a',w:1,title:'Low overall staff attendance',ev:[f.staff.present+' of '+f.staff.total+' staff present'],st:['Ask the in-charge why staff are absent and reassign duties so lab and pharmacy are covered.']})}
stale.forEach(function(x){G.push(x.label+' was last updated '+fmtH(x.h)+' ago (expected within '+x.lim+' h). '+x.fix)});
if(zero.length)G.push('Zero stock is recorded for '+nm(zero)+'. Confirm it is a true stock-out and not a missing receipt entry.');
if(f.staff.moP<f.staff.mo)G.push('Attendance is a manual toggle. Confirm whether absent doctors are on approved leave or official duty.');
if(fp>=1)G.push('Footfall is above the limit. Confirm the count is not double-counting repeat visits or referrals.');
G.push('Not tracked here: ambulance availability, oxygen and power backup. Confirm by phone if the risks above involve referrals.');
R.sort(function(a,b){return (a.sev=='r'?0:1)-(b.sev=='r'?0:1)||b.w-a.w});
var sc=stale.length*1.5;R.forEach(function(r){sc+=r.w});
return{f:f,R:R,G:G,sc:sc,crit:crit,soon:soon,zero:zero,free:free,fp:fp,cap:(freePct+head)/2,stale:stale,su:crit.length*3+zero.length*2+soon.length}}
function payloadOf(f,n){var core={stock:f.stock.map(function(m){return{medicine:m.n,onHand:m.q,minimum:m.min,dailyUse:m.rate}}),footfall:{today:f.foot.c,dailyLimit:f.foot.limit},beds:{occupied:f.beds.o,total:f.beds.t,free:f.beds.t-f.beds.o},attendance:{staffPresent:f.staff.present,staffTotal:f.staff.total,medicalOfficersPresent:f.staff.moP,medicalOfficersTotal:f.staff.mo}};
return{core:core,full:{facility:f.name,type:f.kind,generatedAt:new Date(n).toLocaleString(),data:core,hoursSinceLastUpdate:{stock:+hrs(f.u.s,n).toFixed(1),footfall:+hrs(f.u.f,n).toFixed(1),beds:+hrs(f.u.b,n).toFixed(1),attendance:+hrs(f.u.d,n).toFixed(1)}}}}
function genBrief(id){var n=Date.now(),f=fleet().filter(function(x){return x.id==id})[0],p=payloadOf(f,n);BR={id:id,at:n,key:JSON.stringify(p.core),pay:JSON.stringify(p.full,null,1),a:analyze(f,n)};render()}
function li(a){return '<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'}
function briefUI(){var h='<div class="card brief"><h3 style="margin-top:0">AI Facility Briefing</h3><p class="lead" style="margin:0 0 12px">One tap turns the facility\'s current stock, footfall, beds and attendance into an operations brief: top risks, the evidence behind each, next steps, and what to verify first.</p><div class="row"><button class="bigbt" onclick="genBrief(\'live\')">Generate Today\'s Operations Brief</button><span class="ts">Today is '+new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</span></div>';

function fleetUI(){var n=Date.now(),A=fleet().map(function(f){return analyze(f,n)});
function by(fn,dir){return A.slice().sort(function(x,y){return dir*(fn(x)-fn(y))})[0]}

h+='<div><span class="q">Investigate first</span><b>'+esc(inv.f.name)+'</b><span class="ts">Score '+inv.sc.toFixed(1)+': '+(inv.R.slice(0,3).map(function(r){return esc(r.title.toLowerCase())}).join(', ')||'no risks')+(inv.stale.length?', '+inv.stale.length+' overdue records':'')+'</span></div></div>';
h+='<div class="tbl"><table><tr><th>Facility</th><th>Stock below min</th><th>Beds free</th><th>Footfall</th><th>Doctors in</th><th>Overdue records</th><th>Score</th><th></th></tr>';
A.forEach(function(x){var f=x.f;h+='<tr><td><b>'+esc(f.name)+'</b><div class="ts">'+esc(f.kind)+'</div></td><td>'+x.crit.length+(x.zero.length?' <span class="ts">('+x.zero.length+' at zero)</span>':'')+'</td><td>'+x.free+' / '+f.beds.t+'</td><td>'+f.foot.c+' / '+f.foot.limit+'</td><td>'+f.staff.moP+' / '+f.staff.mo+'</td><td'+(x.stale.length?' class="stale"':'')+'>'+x.stale.length+'</td><td><b>'+x.sc.toFixed(1)+'</b></td><td><button class="sm" style="padding:0 10px;width:auto" onclick="genBrief(\''+f.id+'\')">Brief</button></td></tr>'});
h+='</table></div><div class="lbl">Records that have not been updated</div>';
var any=0;A.forEach(function(x){if(x.stale.length){any=1;h+='<div class="ts"><b>'+esc(x.f.name)+':</b> '+x.stale.map(function(s){return s.label+' ('+fmtH(s.h)+' ago)'}).join(', ')+'</div>'}});
if(!any)h+='<div class="ts">All records are within their update windows.</div>';
return h+'</div>'}
